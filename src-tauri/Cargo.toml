[package]
name = "ara-brief"
version = "0.1.0"
description = "AraBrief desktop news broadcasts"
authors = ["AraBrief"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ara_brief_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
rss = { version = "2.1.2", default-features = false }
dom_query = { version = "0.28.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
zeroize = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
base64 = "0.23"
sha2 = "0.10"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials", "Win32_Graphics_Gdi"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
